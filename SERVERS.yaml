# ============================================================
# SERVERS.yaml — Cluster 项目服务器与数据集注册表
# ============================================================
# 用法:
#   同步代码:    bash scripts/sync.sh <server>
#   远程训练:    bash scripts/remote_train.sh <server> <config> <gpu_ids>
#   查看状态:    bash scripts/remote_status.sh <server>
# ============================================================

# ----- 服务器列表 -----
servers:
  # ---- 本地开发机 ----
  local:
    host: 192.168.1.175
    user: songcl
    role: workstation
    gpu:
      count: 0
      type: none
    remote_code_root: /home/songcl/3dres/project/Cluster
    conda_source: /home/songcl/.conda/etc/profile.d/conda.sh
    conda_env: test
    data_root: /home/songcl/data/data/
