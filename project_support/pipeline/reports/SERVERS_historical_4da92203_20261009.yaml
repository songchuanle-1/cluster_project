    host: 192.168.1.194
    user: songcl
    role: gpu_server
    gpu:
      count: 2
      type: RTX3090
    allowed_gpus: []   # 流水线跳过该机
    remote_code_root: /sdc1/songcl/Project/Cluster_project/Cluster
    conda_source: /home/sysu311/anaconda3/etc/profile.d/conda.sh
    conda_env: project_cluster
    data_root: /sdc1/songcl/IPDN/data/
    work_dir: /sdc1/songcl/Project/Cluster_project/Cluster_checkpoints

  # ---- 四号服务器 (192.168.1.137, 2x RTX 5090) ----
