# ============================================================
# SERVERS.yaml — Cluster 项目服务器与数据集注册表
# ============================================================
# 用法:
#   同步代码:    bash scripts/sync.sh <server>
#   远程训练:    bash scripts/remote_train.sh <server> <config> <gpu_ids>
#   查看状态:    bash scripts/remote_status.sh <server>
# ============================================================

# ----- 服务器列表 -----
servers:
  # ---- 本地开发机 ----
  local:
    host: 192.168.1.175
    user: songcl
    role: gpu_server
    gpu:
      count: 0
      type: RTX3090
    remote_code_root: /home/songcl/3dres/project/cluster_project/Cluster
    conda_source: /home/songcl/.conda/etc/profile.d/conda.sh
    conda_env: prject_cluster
    data_root: /home/songcl/data/data/
    work_dir: /home/songcl/3dres/project/cluster_project/Checkpoints

  # ---- 二号服务器 (192.168.1.163, 2x RTX 3090) ----
  server-2:
    host: 192.168.1.163
    user: songcl
    role: gpu_server
    gpu:
      count: 2
      type: RTX3090
    allowed_gpus: []   # 流水线跳过该机
    remote_code_root: /bak_home/songcl/Project/Cluster_project/Cluster
    conda_source: /home/dl01/anaconda3/etc/profile.d/conda.sh
    conda_env: project_cluster
    data_root: /bak_home/songcl/3D_visual_grounding/data/ipdn_data/data/
    work_dir: /bak_home/songcl/Project/Cluster_project/Cluster_checkpoints

  # ---- 三号服务器 (192.168.1.194, 2x RTX 3090) ----
